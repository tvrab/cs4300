{# Base layout template with required Bootstrap CSS link #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Theater Booking</title>
    <!-- Required Bootstrap 5 CSS CDN link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">
    <!-- Header and Navigation -->
    <header class="mb-4">
        <h1 class="display-5">🎬 Movie Theater Booking</h1>
        <nav class="mt-2">
            <a href="{% url 'movie_list' %}" class="btn btn-primary btn-sm me-2">Movies</a>
            <a href="{% url 'booking_history' %}" class="btn btn-secondary btn-sm">Booking History</a>
        </nav>
    </header>
    <hr>

    <!-- Content Block -->
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
